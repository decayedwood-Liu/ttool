name: Cleanup Old Releases

on:
  schedule:
    # 每天北京时间 0 点运行（UTC+8 对应 UTC 16:00）
    - cron: '0 16 * * *'
  workflow_dispatch:   # 支持手动触发

jobs:
  delete-old-releases-and-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 需要写权限以删除 Release 和 Tag
    steps:
      - name: Delete old releases and their tags
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 获取所有 Releases（最新在前）
            const { data: releases } = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100
            });

            console.log(`Found ${releases.length} releases total.`);

            const KEEP = 2;                     // 保留最新几个 Release
            const SPECIAL_TAGS = ['v720260615', 'v6'];  // 需要保留的特殊 tag

            if (releases.length === 0) {
              console.log('No releases to process.');
              return;
            }

            // 打印所有 Release 供调试
            console.log('\nAll releases:');
            releases.forEach((r, idx) => {
              console.log(`  ${idx + 1}. ${r.tag_name} - ${r.name || 'no name'}`);
            });

            // 收集需要保留的 release id
            const keepReleaseIds = new Set();

            // 1. 保留最新的 KEEP 个
            const latestReleases = releases.slice(0, KEEP);
            for (const release of latestReleases) {
              keepReleaseIds.add(release.id);
              console.log(`\n✅ Keep (latest ${KEEP}): ${release.tag_name}`);
            }

            // 2. 检查特殊 tags 是否需要额外保留
            for (const specialTag of SPECIAL_TAGS) {
              const specialRelease = releases.find(r => r.tag_name === specialTag);
              if (specialRelease) {
                if (!keepReleaseIds.has(specialRelease.id)) {
                  keepReleaseIds.add(specialRelease.id);
                  console.log(`✅ Keep (special): ${specialRelease.tag_name}`);
                } else {
                  console.log(`ℹ️  Special tag ${specialTag} is already among latest ${KEEP}`);
                }
              } else {
                console.log(`⚠️  Special tag ${specialTag} not found in releases.`);
              }
            }

            console.log(`\nTotal releases to keep: ${keepReleaseIds.size}`);
            console.log(`Releases to delete: ${releases.length - keepReleaseIds.size}\n`);

            // 遍历所有 release，删除不在保留列表中的
            let deletedCount = 0;
            for (const release of releases) {
              if (keepReleaseIds.has(release.id)) {
                continue;
              }

              const releaseId = release.id;
              const tagName = release.tag_name;
              const releaseName = release.name || tagName;

              console.log(`\n🗑️  Deleting: ${releaseName} (tag: ${tagName})`);

              // 1. 删除 Release
              try {
                await github.rest.repos.deleteRelease({
                  owner,
                  repo,
                  release_id: releaseId
                });
                console.log(`   ✅ Release deleted`);
              } catch (error) {
                console.error(`   ❌ Failed to delete release: ${error.message}`);
                continue;
              }

              // 2. 删除对应的 Git 标签
              if (tagName) {
                try {
                  await github.rest.git.deleteRef({
                    owner,
                    repo,
                    ref: `tags/${tagName}`
                  });
                  console.log(`   ✅ Tag deleted: ${tagName}`);
                } catch (error) {
                  // 404 表示 tag 不存在，可以忽略
                  if (error.status === 404) {
                    console.log(`   ⚠️  Tag not found: ${tagName}`);
                  } else {
                    console.log(`   ⚠️  Failed to delete tag: ${error.message}`);
                  }
                }
              }
              deletedCount++;
            }

            console.log(`\n========== 清理完成 ==========`);
            console.log(`✅ 保留: ${keepReleaseIds.size} 个 Release`);
            console.log(`🗑️  删除: ${deletedCount} 个 Release（及对应的 Tag）`);
